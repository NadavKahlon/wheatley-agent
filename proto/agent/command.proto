syntax = "proto3";

package agent.command;

message Request {
    oneof request {
        HealthCheckRequest health_check = 2;
        ExecuteRequest execute = 3;
    }
}

message Response {
    oneof response {
        HealthCheckResponse health_check = 2;
        ExecuteResponse execute = 3;
    }
}

message HealthCheckRequest {}

message HealthCheckResponse {}


message ExecuteRequest {
    string command = 1;
}

message ExecuteResponse {
    string output = 1;
}
