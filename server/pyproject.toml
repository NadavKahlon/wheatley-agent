[project]
name = "wheatley-server"
version = "0.1.0"
description = "Wheatley Command & Control Server"
requires-python = ">=3.11"
dependencies = [
    "asyncio>=4.0.0",
    "ipython>=9.10.1",
    "loguru>=0.7.3",
    "mypy-protobuf>=5.0.0",
    "protobuf>=7.34.1",
]

[project.scripts]
wheatley-server = "wheatley_server.main:start"
